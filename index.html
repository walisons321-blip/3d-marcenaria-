<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Marcenaria 3D — BLEND</title>
<style>
html,body{margin:0;height:100%;font-family:system-ui;background:#151515;color:#fff;overflow:hidden}#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}header{padding:10px 12px;background:#222;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,label.btn{background:#f2f2f2;color:#111;border:0;border-radius:9px;padding:9px 11px;font-weight:700;font-size:14px}input[type=file]{display:none}#stage{position:relative;min-height:0}canvas{display:block;width:100%;height:100%}#panel{background:#222;padding:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}#panel label{font-size:11px;color:#bbb}#panel input{width:100%;box-sizing:border-box;margin-top:3px;padding:7px;border:0;border-radius:7px}#status{font-size:12px;color:#bbb;flex:1;min-width:120px}
</style>
</head>
<body><div id="app">
<header>
<label class="btn">Abrir .BLEND<input id="blendFile" type="file" accept=".blend" /></label>
<label class="btn">Adicionar GLB/GLTF<input id="file" type="file" accept=".glb,.gltf" /></label>
<button id="addBox">Módulo teste</button><button id="delete">Excluir</button>
<input id="texture" type="file" accept="image/*"/><label class="btn" for="texture">Material/Imagem</label>
<span id="status">Toque em um módulo para editar.</span>
</header>
<div id="stage"></div>
<div id="panel">
<label>Largura (m)<input id="sx" type="number" step="0.05" value="1"></label>
<label>Altura (m)<input id="sy" type="number" step="0.05" value="1"></label>
<label>Profundidade (m)<input id="sz" type="number" step="0.05" value="1"></label>
</div></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const stage=document.querySelector('#stage'), status=document.querySelector('#status');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true; stage.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xdedbd3);
const camera=new THREE.PerspectiveCamera(50,1,.01,100); camera.position.set(4,3,5);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.target.set(0,1,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x666666,2)); const dl=new THREE.DirectionalLight(0xffffff,3); dl.position.set(3,6,4); dl.castShadow=true; scene.add(dl);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0xb8b2a7,roughness:.9})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const grid=new THREE.GridHelper(20,40,0x777777,0xaaaaaa); grid.position.y=.002; scene.add(grid);
let selected=null; const ray=new THREE.Raycaster(), pointer=new THREE.Vector2();
function fit(){const r=stage.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); camera.aspect=r.width/r.height; camera.updateProjectionMatrix()} addEventListener('resize',fit); fit();
function select(o){selected=o; status.textContent=o?'Módulo selecionado. Ajuste as medidas abaixo.':'Nenhum módulo selecionado.'; if(o){document.querySelector('#sx').value=o.scale.x.toFixed(2);document.querySelector('#sy').value=o.scale.y.toFixed(2);document.querySelector('#sz').value=o.scale.z.toFixed(2)}}
function addBox(){const m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0xd9c5a0,roughness:.65}));m.position.set(0,.5,0);m.castShadow=m.receiveShadow=true;m.userData.editable=true;scene.add(m);select(m)}
document.querySelector('#addBox').onclick=addBox;
renderer.domElement.addEventListener('pointerdown',e=>{const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(scene.children,true).filter(h=>h.object!==floor&&h.object!==grid);if(hits.length){let o=hits[0].object;while(o.parent!==scene&&o.parent)o=o.parent;select(o.userData.editable?o:hits[0].object)} });
['sx','sy','sz'].forEach((id,i)=>document.querySelector('#'+id).oninput=e=>{if(!selected)return;selected.scale[['x','y','z'][i]]=Math.max(.05,+e.target.value||.05); if(i===1 && selected.geometry) selected.position.y=selected.scale.y/2});
document.querySelector('#delete').onclick=()=>{if(selected){scene.remove(selected);select(null)}};
document.querySelector('#blendFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;status.textContent='Enviando e convertendo .BLEND…';const fd=new FormData();fd.append('file',f);try{const r=await fetch('/api/convert-blend',{method:'POST',body:fd});const data=await r.json();if(!r.ok)throw new Error(data.error+(data.details?' '+data.details:''));new GLTFLoader().load(data.url,g=>{g.scene.userData.editable=true;g.scene.name=data.name||f.name;g.scene.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true}});scene.add(g.scene);select(g.scene);status.textContent='BLEND convertido e aberto: '+f.name},undefined,err=>status.textContent='Conversão concluída, mas houve erro ao abrir GLB: '+err.message)}catch(err){status.textContent='Erro: '+err.message}finally{e.target.value=''}};
document.querySelector('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);new GLTFLoader().load(url,g=>{g.scene.userData.editable=true;g.scene.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true}});scene.add(g.scene);select(g.scene);URL.revokeObjectURL(url)},undefined,err=>status.textContent='Erro ao abrir modelo: '+err.message)};
document.querySelector('#texture').onchange=e=>{if(!selected||!e.target.files[0])return;const url=URL.createObjectURL(e.target.files[0]);new THREE.TextureLoader().load(url,t=>{t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;selected.traverse(o=>{if(o.isMesh){o.material=new THREE.MeshStandardMaterial({map:t,roughness:.65})}});URL.revokeObjectURL(url)})};
addBox(); (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();
</script></body></html>
